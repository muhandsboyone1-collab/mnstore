<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MNSTORE - Premium Digital Goods</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { font-family: 'Inter', sans-serif; }
    .custom-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scroll::-webkit-scrollbar-track { background: #020617; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">

  <div id="loadingOverlay" class="fixed inset-0 bg-slate-950 z-50 flex flex-col items-center justify-center transition-all duration-300">
    <div class="relative mb-4">
      <div class="absolute -inset-1 rounded-full bg-amber-500/20 blur-xl"></div>
      <img src="photo_2026-04-11_23-46-59.jpg" alt="MNSTORE Logo" class="w-20 h-20 rounded-full border border-amber-500/30 relative z-10 animate-pulse object-cover">
    </div>
    <div class="w-12 h-12 rounded-full border-2 border-slate-800 border-t-amber-500 animate-spin"></div>
    <p class="text-sm text-slate-400 mt-4 tracking-wider animate-pulse">Menghubungkan ke server...</p>
  </div>

  <header class="border-b border-slate-900 bg-slate-950/80 backdrop-blur-md sticky top-0 z-30">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3 cursor-pointer" onclick="navigate('/')">
        <img src="photo_2026-04-11_23-46-59.jpg" alt="Logo" class="w-9 h-9 rounded-full border border-amber-500/20 object-cover">
        <span class="font-bold text-white text-lg tracking-tight">MN<span class="text-amber-400">STORE</span></span>
      </div>
      <div class="flex items-center gap-4 text-sm font-semibold">
        <button onclick="navigate('/affiliate')" class="text-slate-300 hover:text-amber-400 transition-colors">Affiliate Area</button>
        <button onclick="navigate('/register')" class="px-4 py-2 bg-amber-500 hover:bg-amber-400 text-slate-950 rounded-xl transition-all shadow-md shadow-amber-500/10">Gabung Reseller</button>
      </div>
    </div>
  </header>

  <div id="view-storefront" class="view-panel hidden relative">
     <main class="max-w-7xl mx-auto px-4 py-8">
        <div id="productsShelf" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6"></div>
     </main>
  </div>

  <div id="view-order" class="view-panel hidden max-w-md mx-auto px-4 py-16">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl">
      <form id="orderForm" onsubmit="submitOrder(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-300 uppercase mb-2">Nama Lengkap</label>
          <input type="text" id="ordNama" required class="w-full px-4 py-3 bg-slate-950 border border-slate-800 rounded-xl text-white text-sm focus:ring-1 focus:ring-amber-500">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-300 uppercase mb-2">WhatsApp / Telegram</label>
          <input type="text" id="ordKontak" required class="w-full px-4 py-3 bg-slate-950 border border-slate-800 rounded-xl text-white text-sm">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-300 uppercase mb-2">Produk</label>
          <select id="ordProduct" onchange="updateCheckoutPrice()" required class="w-full px-4 py-3 bg-slate-950 border border-slate-800 rounded-xl text-white text-sm">
          </select>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-300 uppercase mb-2">Metode Pembayaran</label>
          <select id="ordPayment" required class="w-full px-4 py-3 bg-slate-950 border border-slate-800 rounded-xl text-white text-sm focus:ring-1 focus:ring-amber-500">
            <option value="QRIS">QRIS (Otomatis)</option>
            <option value="DANA">DANA</option>
            <option value="Transfer Bank">Transfer Bank</option>
            <option value="GoPay">GoPay</option>
          </select>
        </div>
        <button type="submit" id="ordBtn" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-3 rounded-xl transition-all">Kirim Order</button>
      </form>
    </div>
  </div>

  <script>
    const webAppUrl = "https://script.google.com/macros/s/AKfycbwGKfhPQKX1mCaqr4J1syLl1Jp-lTGsrpZQlvI3vytSRVqGQZSVxrB_3uLlM3Msc67R/exec";

    // ADMIN DATA LOADER (FIXED)
    function loadAdminData() {
        const adminPass = "AdminMNSTORE123"; 
        // Penambahan &pass=... agar Code.gs tidak error
        fetch(`${webAppUrl}?action=getAdminDashboard&pass=${encodeURIComponent(adminPass)}`)
        .then(r => r.json())
        .then(res => {
            if (res.success) {
                // ... logic render admin dashboard Anda ...
                // Pastikan fungsi ini memanggil render function Anda
                renderAdminDashboard(res.data);
            } else {
                alert("Error: " + res.message);
            }
        });
    }

    // SUBMIT ORDER (UPDATED)
    function submitOrder(e) {
      e.preventDefault();
      const payload = {
        buyerName: document.getElementById('ordNama').value,
        buyerContact: document.getElementById('ordKontak').value,
        product: document.getElementById('ordProduct').value,
        ref: localStorage.getItem('mnstore_ref') || '',
        paymentMethod: document.getElementById('ordPayment').value // Menangkap metode pembayaran
      };

      fetch(`${webAppUrl}?action=addSale`, {
        method: "POST",
        body: JSON.stringify(payload)
      }).then(r => r.json()).then(res => {
         // ... handling response ...
      });
    }
    
    // ... sisa fungsi lainnya tetap sama ...
  </script>
</body>
</html>
