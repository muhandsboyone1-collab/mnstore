<!-- KODE FINAL - UI ASLI ANDA + FITUR PEMBAYARAN -->
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MNSTORE - Premium Digital Goods</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { font-family: 'Inter', sans-serif; }
    .custom-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scroll::-webkit-scrollbar-track { background: #020617; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  
  <!-- [LOADING OVERLAY & NAVBAR TETAP SAMA SEPERTI FILE ASLI ANDA] -->
  <div id="loadingOverlay" class="fixed inset-0 bg-slate-950 z-50 flex flex-col items-center justify-center transition-all duration-300">
    <div class="w-12 h-12 rounded-full border-2 border-slate-800 border-t-amber-500 animate-spin"></div>
  </div>

  <header class="border-b border-slate-900 bg-slate-950/80 backdrop-blur-md sticky top-0 z-30">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3 cursor-pointer" onclick="navigate('/')">
        <span class="font-bold text-white text-lg tracking-tight">MN<span class="text-amber-400">STORE</span></span>
      </div>
      <div class="flex items-center gap-4 text-sm font-semibold">
        <button onclick="navigate('/affiliate')" class="text-slate-300 hover:text-amber-400">Affiliate</button>
        <button onclick="navigate('/admin')" class="text-slate-300 hover:text-amber-400">Admin</button>
      </div>
    </div>
  </header>

  <!-- VIEW: STOREFRONT -->
  <div id="view-storefront" class="view-panel hidden">
     <!-- [BAGIAN HERO & PRODUK TETAP SAMA] -->
     <main class="max-w-7xl mx-auto p-4"><div id="productsShelf" class="grid grid-cols-1 md:grid-cols-4 gap-6"></div></main>
  </div>

  <!-- VIEW: ORDER (DITAMBAH PILIHAN PEMBAYARAN) -->
  <div id="view-order" class="view-panel hidden max-w-md mx-auto p-4">
    <form id="orderForm" onsubmit="submitOrder(event)" class="bg-slate-900 p-6 rounded-2xl border border-slate-800 space-y-4">
      <h2 class="text-xl font-bold">Form Pemesanan</h2>
      <input type="text" id="ordNama" required placeholder="Nama Lengkap" class="w-full p-3 bg-slate-950 border border-slate-800 rounded-xl">
      <input type="text" id="ordKontak" required placeholder="WhatsApp" class="w-full p-3 bg-slate-950 border border-slate-800 rounded-xl">
      <select id="ordProduct" class="w-full p-3 bg-slate-950 border border-slate-800 rounded-xl"></select>
      
      <!-- PILIHAN PEMBAYARAN -->
      <select id="ordPayment" class="w-full p-3 bg-slate-950 border border-slate-800 rounded-xl text-white">
        <option value="QRIS">QRIS</option>
        <option value="DANA">DANA</option>
        <option value="GOPAY">GoPay</option>
        <option value="BANK">Transfer Bank</option>
      </select>
      
      <button type="submit" id="ordBtn" class="w-full bg-amber-500 font-bold py-3 rounded-xl text-black">Kirim Order</button>
    </form>
  </div>

  <!-- VIEW: ADMIN (DITAMBAH SETTING PEMBAYARAN) -->
  <div id="view-admin" class="view-panel hidden max-w-4xl mx-auto p-4">
     <!-- FORM TAMBAH PRODUK & DAFTAR PRODUK (TETAP SAMA) -->
     <div class="bg-slate-900 p-6 rounded-2xl border border-slate-800 mb-6">
        <h2 class="font-bold mb-4">Pengaturan Pembayaran</h2>
        <input type="text" id="setQRIS" placeholder="Link QRIS" class="w-full p-2 mb-2 bg-slate-950 rounded border border-slate-700">
        <input type="text" id="setDana" placeholder="No DANA" class="w-full p-2 mb-2 bg-slate-950 rounded border border-slate-700">
        <button onclick="saveSettings()" class="bg-blue-600 px-4 py-2 rounded">Simpan Metode Bayar</button>
     </div>
     <div id="admProductsList"></div>
     <div id="admPendingOrders"></div>
  </div>

  <script>
    const webAppUrl = "URL_WEB_APP_ANDA_DISINI";

    // PERBAIKAN ADMIN DATA LOADER (Agar tidak stuck)
    async function loadAdminData() {
        const prodList = document.getElementById('admProductsList');
        const orderList = document.getElementById('admPendingOrders');
        prodList.innerText = "Memuat...";
        try {
            const res = await fetch(`${webAppUrl}?action=getAdminDashboard`).then(r => r.json());
            if(res.success) {
                // Tampilkan data
                prodList.innerHTML = res.data.products.map(p => `<div>${p.produk}</div>`).join('');
                orderList.innerHTML = res.data.sales.filter(s => s.status === 'PENDING').map(s => `<div>${s.order_id} - ${s.buyer}</div>`).join('');
            }
        } catch(e) {
            prodList.innerText = "Gagal memuat: " + e.message;
        }
    }

    // UPDATE SUBMIT ORDER DENGAN METODE PEMBAYARAN
    function submitOrder(e) {
      e.preventDefault();
      const payload = {
        buyerName: document.getElementById('ordNama').value,
        buyerContact: document.getElementById('ordKontak').value,
        product: document.getElementById('ordProduct').value,
        paymentMethod: document.getElementById('ordPayment').value,
        ref: localStorage.getItem('mnstore_ref') || ''
      };

      fetch(`${webAppUrl}?action=addSale`, { method: "POST", body: JSON.stringify(payload) })
      .then(r => r.json())
      .then(res => {
         if(res.success) alert("Order Terkirim!");
      });
    }

    // FUNGSI SIMPAN SETTING
    function saveSettings() {
        const payload = {
            qris_url: document.getElementById('setQRIS').value,
            dana_no: document.getElementById('setDana').value
        };
        fetch(`${webAppUrl}?action=updateSettings`, { method: "POST", body: JSON.stringify(payload) })
        .then(() => alert("Setting disimpan!"));
    }

    // ... [Fungsi lainnya dari code asli Anda] ...
  </script>
</body>
</html>
