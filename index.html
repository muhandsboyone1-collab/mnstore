<!-- index.html (Versi Final & Stabil) -->
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MNSTORE - Premium Digital Goods</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { font-family: 'Inter', sans-serif; }
    .custom-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
    .view-panel { display: none; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">

  <!-- LOADING SCREEN -->
  <div id="loadingOverlay" class="fixed inset-0 bg-slate-950 z-50 flex flex-col items-center justify-center transition-all duration-300">
    <div class="w-12 h-12 rounded-full border-2 border-slate-800 border-t-amber-500 animate-spin"></div>
    <p class="text-sm text-slate-400 mt-4 tracking-wider">Menghubungkan ke server...</p>
  </div>

  <!-- NAV BAR -->
  <header class="border-b border-slate-900 bg-slate-950/80 backdrop-blur-md sticky top-0 z-30">
    <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="font-bold cursor-pointer" onclick="navigate('/')">MN<span class="text-amber-400">STORE</span></div>
      <div class="flex gap-4 text-sm font-semibold">
        <button onclick="navigate('/affiliate')">Affiliate</button>
        <button onclick="navigate('/admin')">Admin</button>
      </div>
    </div>
  </header>

  <!-- VIEW: STOREFRONT -->
  <div id="view-storefront" class="view-panel p-4">
    <main class="max-w-7xl mx-auto py-8">
      <div id="productsShelf" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
        <p class="text-center col-span-full">Memuat produk...</p>
      </div>
    </main>
  </div>

  <!-- VIEW: ORDER -->
  <div id="view-order" class="view-panel max-w-md mx-auto p-4 py-16">
    <form id="orderForm" onsubmit="submitOrder(event)" class="bg-slate-900 p-6 rounded-2xl border border-slate-800 space-y-4">
      <h2 class="text-xl font-bold">Form Pemesanan</h2>
      <input type="text" id="ordNama" required placeholder="Nama" class="w-full p-3 bg-slate-950 border border-slate-800 rounded-xl">
      <input type="text" id="ordKontak" required placeholder="WhatsApp" class="w-full p-3 bg-slate-950 border border-slate-800 rounded-xl">
      <select id="ordProduct" class="w-full p-3 bg-slate-950 border border-slate-800 rounded-xl text-white"></select>
      <select id="ordPayment" class="w-full p-3 bg-slate-950 border border-slate-800 rounded-xl text-white">
        <option value="QRIS">QRIS</option>
        <option value="DANA">DANA</option>
        <option value="BANK">Bank Transfer</option>
      </select>
      <button type="submit" class="w-full bg-amber-500 font-bold py-3 rounded-xl">Kirim Order</button>
    </form>
  </div>

  <!-- VIEW: ADMIN (Fungsi loadAdminData di sini) -->
  <div id="view-admin" class="view-panel p-4">
    <div id="adminLoginArea" class="max-w-md mx-auto bg-slate-900 p-6 rounded-2xl">
        <input type="password" id="adminPass" placeholder="Password Admin" class="w-full p-3 bg-slate-950 border border-slate-800 rounded-xl mb-4">
        <button onclick="checkAdmin()" class="w-full bg-red-600 p-3 rounded-xl font-bold">Login Admin</button>
    </div>
    <div id="adminDashArea" class="hidden">
        <h2 class="text-2xl font-bold mb-4">Admin Panel</h2>
        <div id="admProductsList" class="space-y-2"></div>
    </div>
  </div>

  <script>
    const webAppUrl = "URL_WEB_APP_ANDA_DISINI"; // GANTI URL WEB APP ANDA

    function navigate(path) {
        window.history.pushState({}, '', path);
        router();
    }

    function router() {
        const path = window.location.pathname.replace(/^\/|\/$/g, '');
        document.querySelectorAll('.view-panel').forEach(v => v.classList.add('hidden'));
        
        const views = { '': 'view-storefront', 'affiliate': 'view-affiliate', 'order': 'view-order', 'admin': 'view-admin' };
        const activeView = document.getElementById(views[path] || 'view-storefront');
        if(activeView) activeView.classList.remove('hidden');

        // Safety Kill Loader
        setTimeout(() => document.getElementById('loadingOverlay').classList.add('hidden'), 1000);
    }

    async function loadAdminData() {
        const list = document.getElementById('admProductsList');
        try {
            const res = await fetch(`${webAppUrl}?action=getAdminDashboard`).then(r => r.json());
            if(!res.success) throw new Error(res.message);
            list.innerHTML = res.data.products.map(p => `<div class="p-2 border-b border-slate-800">${p.produk}</div>`).join('');
        } catch(e) {
            list.innerHTML = "Gagal memuat: " + e.message;
        }
    }

    function checkAdmin() {
        if(document.getElementById('adminPass').value === "AdminMNSTORE123") {
            document.getElementById('adminLoginArea').classList.add('hidden');
            document.getElementById('adminDashArea').classList.remove('hidden');
            loadAdminData();
        } else {
            alert("Password Salah");
        }
    }

    window.onload = router;
  </script>
</body>
</html>
