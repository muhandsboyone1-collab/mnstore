<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MNSTORE - Premium Digital Goods</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-950 text-slate-100">

  <!-- LOADING OVERLAY -->
  <div id="loadingOverlay" class="fixed inset-0 bg-slate-950 z-50 flex items-center justify-center">
    <div class="w-12 h-12 border-4 border-slate-800 border-t-amber-500 rounded-full animate-spin"></div>
  </div>

  <div id="content" class="p-4">
      <h1 class="text-2xl font-bold text-center mb-6">Etalase Produk</h1>
      <div id="productsShelf" class="grid grid-cols-2 gap-4 max-w-4xl mx-auto">
        <p class="text-center col-span-2">Memuat produk...</p>
      </div>
  </div>

  <script>
    const webAppUrl = "URL_WEB_APP_ANDA_DISINI"; // PASTI GANTI INI

    async function loadProductsList() {
      const shelf = document.getElementById('productsShelf');
      try {
        const response = await fetch(`${webAppUrl}?action=getProducts`);
        const res = await response.json();
        
        if (res.success && res.data.length > 0) {
            shelf.innerHTML = res.data.map(p => `
                <div class="bg-slate-900 p-4 rounded-xl border border-slate-800">
                    <img src="${p.gambar}" class="w-full h-32 object-cover rounded-lg mb-2">
                    <h3 class="font-bold">${p.produk}</h3>
                    <p class="text-amber-400">Rp ${Number(p.harga).toLocaleString()}</p>
                </div>
            `).join('');
        } else {
            shelf.innerHTML = "<p class='text-center col-span-2'>Belum ada produk.</p>";
        }
      } catch (err) {
        shelf.innerHTML = "<p class='text-center col-span-2 text-red-500'>Server sibuk, coba lagi nanti.</p>";
      } finally {
        // PAKSA HILANGKAN LOADING
        document.getElementById('loadingOverlay').classList.add('hidden');
      }
    }

    // PAKSA HILANGKAN LOADING JIKA FETCH MACET (Safety Timeout)
    setTimeout(() => {
        document.getElementById('loadingOverlay').classList.add('hidden');
    }, 3000);

    window.onload = loadProductsList;
  </script>
</body>
</html>
